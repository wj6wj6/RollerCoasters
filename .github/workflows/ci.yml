name: Linux quality

# Fast feedback on every PR push (a few minutes, against about six for
# Windows): format, repository policy, the platform-neutral code and all CTest
# checks built with clang on Linux, and a MinGW syntax pass over every file
# against the real Windows SDK headers. MSVC, clang-cl, /analyze and packaging
# run in windows.yml on the same pushes. tests/linux also works in a cloud
# environment without Windows.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    # Draft PRs are still being written; their checks start when marked ready.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # A newer push to the same branch or PR supersedes the running check.
    concurrency:
      group: linux-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      # Ubuntu mirrors can be slow enough to time the job out, so the .deb
      # files are cached; the script falls back to apt when they don't fit.
      - uses: actions/cache@v4
        with:
          path: ~/apt-debs
          key: apt-debs-ubuntu-24.04-${{ hashFiles('tests/linux/install-packages.sh') }}
      - name: Install packages
        timeout-minutes: 10
        run: tests/linux/install-packages.sh ~/apt-debs
      - name: Format, repository policy and script syntax
        shell: pwsh
        run: ./scripts/check.ps1 -Stage quick
      - name: Compile with clang -Wall -Werror
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake -S tests/linux -B out/build/linux -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build out/build/linux
      - name: CTest
        run: xvfb-run -a ctest --test-dir out/build/linux --output-on-failure --no-tests=error --output-junit results-linux.xml
      - name: Win32 syntax against the Windows SDK headers (MinGW)
        run: tests/linux/win32-syntax.sh
      - name: Upload test evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-linux
          path: |
            out/build/linux/results-linux.xml
            out/build/linux/Testing/Temporary/LastTest.log
          retention-days: 7
          if-no-files-found: ignore
