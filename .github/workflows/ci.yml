name: Linux quality

# Fast feedback on every PR push (a few minutes, against about six for
# Windows): format, repository policy, the platform-neutral code and all CTest
# checks built with clang on Linux, and a MinGW syntax pass over every file
# against the real Windows SDK headers. MSVC, clang-cl, /analyze and packaging
# run in windows.yml on the same pushes. tests/linux also works in a cloud
# environment without Windows.
#
# Ubuntu mirrors are sometimes slow enough to time a job out, so each job
# caches the .deb files it downloads (the script installs from them without
# the network) and saves them as soon as they are installed, whatever the
# later steps do. MinGW, most of the download, is in its own job, so the
# main checks do not wait for it.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    # Draft PRs are still being written; their checks start when marked ready.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # A newer push to the same branch or PR supersedes the running check.
    concurrency:
      group: linux-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - id: debs
        uses: actions/cache/restore@v4
        with:
          path: ~/apt-debs
          key: apt-debs-core-ubuntu-24.04-${{ hashFiles('tests/linux/install-packages.sh') }}
      - name: Install packages
        timeout-minutes: 10
        run: tests/linux/install-packages.sh --only core ~/apt-debs
      - name: Keep the downloaded packages for the next run
        if: steps.debs.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/apt-debs
          key: ${{ steps.debs.outputs.cache-primary-key }}
      - name: Format, repository policy and script syntax
        shell: pwsh
        run: ./scripts/check.ps1 -Stage quick
      - name: Compile with clang -Wall -Werror
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake -S tests/linux -B out/build/linux -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build out/build/linux
      - name: CTest
        run: xvfb-run -a ctest --test-dir out/build/linux --output-on-failure --no-tests=error --output-junit results-linux.xml
      - name: Upload test evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-linux
          path: |
            out/build/linux/results-linux.xml
            out/build/linux/Testing/Temporary/LastTest.log
          retention-days: 7
          if-no-files-found: ignore

  win32-syntax:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: win32-syntax-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - id: debs
        uses: actions/cache/restore@v4
        with:
          path: ~/apt-debs
          key: apt-debs-mingw-ubuntu-24.04-${{ hashFiles('tests/linux/install-packages.sh') }}
      - name: Install MinGW-w64
        timeout-minutes: 12
        run: tests/linux/install-packages.sh --only mingw ~/apt-debs
      - name: Keep the downloaded packages for the next run
        if: steps.debs.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/apt-debs
          key: ${{ steps.debs.outputs.cache-primary-key }}
      - name: Win32 syntax against the Windows SDK headers (MinGW)
        run: tests/linux/win32-syntax.sh
