name: Windows quality

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Download and unpack the pinned toolchain once, then share it through the cache.
  tools:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: out/tools
          key: native-tools-windows-x64-${{ hashFiles('tools.json', 'scripts/setup-tools.ps1') }}
      - name: Restore native tools
        run: ./scripts/setup-tools.ps1 -WithClang
      - name: Format
        run: ./scripts/check.ps1 -Stage format

  quality:
    needs: tools
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]
        compiler: [msvc, clang]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: out/tools
          key: native-tools-windows-x64-${{ hashFiles('tools.json', 'scripts/setup-tools.ps1') }}
          fail-on-cache-miss: true
      - name: Lint and static analysis
        run: ./scripts/check.ps1 -Stage lint -Compiler ${{ matrix.compiler }} -Config ${{ matrix.config }}
      - name: Compile and link
        run: ./scripts/check.ps1 -Stage build -Compiler ${{ matrix.compiler }} -Config ${{ matrix.config }}
      - name: Integration and smoke tests
        run: ./scripts/check.ps1 -Stage test -Compiler ${{ matrix.compiler }} -Config ${{ matrix.config }}
      - name: Install and verify distribution
        run: ./scripts/check.ps1 -Stage package -Compiler ${{ matrix.compiler }} -Config ${{ matrix.config }}
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.compiler }}-${{ matrix.config }}
          path: |
            out/build/**/results-*.xml
            out/build/**/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
      - name: Upload verified distribution
        uses: actions/upload-artifact@v4
        with:
          name: RollerCoasters-windows-x64-${{ matrix.compiler }}-${{ matrix.config }}
          path: out/package
          if-no-files-found: error
